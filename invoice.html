<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Estimate Form</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      font-size: 12px;
      background: #e0e0e0;
      padding: 20px;
    }

    .no-print {
      text-align: center;
      margin-bottom: 20px;
    }

    .no-print button {
      background: #222;
      color: #fff;
      border: none;
      padding: 10px 28px;
      font-size: 14px;
      cursor: pointer;
      border-radius: 4px;
      margin: 0 6px;
    }
    .no-print button:hover { background: #444; }

    /* ── PAPER ── */
    .page {
      width: 816px;
      min-height: 1056px;
      background: #fff;
      margin: 0 auto;
      padding: 28px 32px 36px;
      border: 1px solid #bbb;
    }

    /* editable fields */
    input[type="text"], input[type="number"], textarea {
      border: none;
      border-bottom: 1px solid #999;
      outline: none;
      background: transparent;
      font-family: inherit;
      font-size: inherit;
      width: 100%;
      padding: 1px 2px;
    }
    input[type="number"] { -moz-appearance: textfield; }
    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; }
    textarea { resize: none; overflow: hidden; }

    /* ── HEADER ── */
    .header {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: start;
      margin-bottom: 10px;
    }

    .company-info { text-align: center; padding-top: 4px; }
    .company-info input { text-align: center; font-weight: bold; }
    .company-info .company-name input { font-size: 15px; font-weight: bold; }

    .estimate-block { text-align: right; }
    .estimate-title {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 8px;
    }
    .meta-table { border-collapse: collapse; float: right; }
    .meta-table td {
      border: 1px solid #000;
      padding: 2px 5px;
      white-space: nowrap;
    }
    .meta-table td:first-child { font-size: 10px; font-weight: bold; padding-right: 8px; }
    .meta-table td input { width: 110px; }

    /* ── ADDRESS SECTION ── */
    .address-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 10px 0;
    }
    .address-box {
      border: 1px solid #000;
      padding: 4px 6px;
      min-height: 72px;
    }
    .address-box .label {
      font-size: 10px;
      font-weight: bold;
      margin-bottom: 3px;
    }
    .address-box textarea {
      border-bottom: none;
      width: 100%;
      height: 52px;
      line-height: 1.6;
    }

    /* ── ITEMS TABLE ── */
    .items-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 4px;
    }
    .items-table thead tr {
      background: #000;
      color: #fff;
    }
    .items-table thead th {
      padding: 5px 4px;
      text-align: center;
      font-size: 11px;
      letter-spacing: 0.5px;
    }
    .items-table tbody tr { border-bottom: 1px solid #ccc; }
    .items-table tbody td {
      padding: 2px 4px;
      vertical-align: middle;
    }
    .col-qty   { width: 58px; text-align: center; }
    .col-desc  { }
    .col-price { width: 90px; text-align: right; }
    .col-total { width: 90px; text-align: right; }
    .items-table tbody td input { text-align: inherit; }
    .items-table tbody td.col-total input { color: #000; }

    /* ── FOOTER ── */
    .footer-area {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-top: 8px;
    }
    .thank-you { font-size: 13px; font-style: italic; font-weight: bold; }

    .totals-table { border-collapse: collapse; }
    .totals-table td {
      border: 1px solid #000;
      padding: 3px 6px;
      font-size: 11px;
    }
    .totals-table td:first-child { font-weight: bold; white-space: nowrap; text-align: right; }
    .totals-table td input { width: 100px; text-align: right; }

    /* ── ADD ROW BUTTON ── */
    .add-row-btn {
      background: none;
      border: 1px dashed #aaa;
      color: #888;
      font-size: 11px;
      cursor: pointer;
      padding: 3px 10px;
      margin: 4px 0 8px;
      border-radius: 3px;
    }
    .add-row-btn:hover { background: #f5f5f5; color: #333; }

    .del-btn {
      background: none;
      border: none;
      color: #bbb;
      cursor: pointer;
      font-size: 14px;
      padding: 0 2px;
      line-height: 1;
    }
    .del-btn:hover { color: #e00; }

    /* ── PRINT ── */
    @media print {
      body { background: #fff; padding: 0; }
      .no-print { display: none !important; }
      .add-row-btn { display: none !important; }
      .del-btn { display: none !important; }
      .page { border: none; margin: 0; padding: 20px 28px; width: 100%; min-height: auto; }
      input, textarea { border-bottom-color: transparent !important; }
      @page { size: Letter portrait; margin: 0; }
    }
  </style>
</head>
<body>

<div class="no-print">
  <button onclick="downloadPDF()" id="downloadBtn">⬇ Download PDF</button>
  <button onclick="clearForm()">✕ Clear Form</button>
</div>

<div class="page">

  <!-- HEADER -->
  <div class="header">

    <!-- Company info -->
    <div class="company-info">
      <div class="company-name"><input type="text" id="companyName" placeholder="COMPANY NAME" style="font-size:15px;font-weight:bold;"/></div>
      <div><input type="text" id="companyAddress" placeholder="Address"/></div>
      <div><input type="text" id="companyCityStateZip" placeholder="City, State, ZIP"/></div>
      <div><input type="text" id="companyPhone" placeholder="Phone Number"/></div>
      <div><input type="text" id="companyEmailWeb" placeholder="Email or Website"/></div>
    </div>

    <!-- Estimate label + meta -->
    <div class="estimate-block">
      <div class="estimate-title">ESTIMATE</div>
      <table class="meta-table">
        <tr>
          <td>Invoice Date</td>
          <td><input type="text" placeholder="MM/DD/YYYY" id="invoiceDate"/></td>
        </tr>
        <tr>
          <td>Customer No.</td>
          <td><input type="text" id="customerNo" placeholder=""/></td>
        </tr>
        <tr>
          <td>Invoice No.</td>
          <td><input type="text" id="invoiceNo" placeholder=""/></td>
        </tr>
      </table>
    </div>

  </div>

  <!-- ADDRESS -->
  <div class="address-row">
    <div class="address-box">
      <div class="label">TO:</div>
      <textarea id="billTo" placeholder="Name&#10;Address&#10;City, State ZIP&#10;Phone"></textarea>
    </div>
    <div class="address-box">
      <div class="label">DELIVER TO: (If Different):</div>
      <textarea id="deliverTo" placeholder="Name&#10;Address&#10;City, State ZIP&#10;Phone"></textarea>
    </div>
  </div>

  <!-- ITEMS TABLE -->
  <table class="items-table" id="itemsTable">
    <thead>
      <tr>
        <th class="col-qty">QTY</th>
        <th class="col-desc">DESCRIPTION</th>
        <th class="col-price">PRICE</th>
        <th class="col-total">TOTAL</th>
        <th style="width:22px" class="no-print"></th>
      </tr>
    </thead>
    <tbody id="itemsBody">
    </tbody>
  </table>

  <button class="add-row-btn no-print" onclick="addRow()">+ Add line</button>

  <!-- FOOTER -->
  <div class="footer-area">
    <div class="thank-you">Thank you!</div>
    <table class="totals-table">
      <tr>
        <td>SUBTOTAL $</td>
        <td><input type="text" id="subtotal" readonly placeholder="0.00"/></td>
      </tr>
      <tr>
        <td>SALES TAX $</td>
        <td><input type="number" id="salesTax" placeholder="0.00" oninput="calcTotals()" step="0.01"/></td>
      </tr>
      <tr>
        <td>INVOICE TOTAL $</td>
        <td><input type="text" id="invoiceTotal" readonly placeholder="0.00"/></td>
      </tr>
    </table>
  </div>

</div><!-- /page -->

<script>
  // ── Download PDF ──
  async function downloadPDF() {
    const btn = document.getElementById('downloadBtn');
    btn.textContent = 'Generating…';
    btn.disabled = true;

    // Temporarily hide no-print elements and buttons inside the page
    const noPrint = document.querySelectorAll('.no-print');
    noPrint.forEach(el => el.style.visibility = 'hidden');

    const page = document.querySelector('.page');
    const canvas = await html2canvas(page, {
      scale: 2,
      useCORS: true,
      backgroundColor: '#ffffff',
      scrollX: 0,
      scrollY: -window.scrollY
    });

    noPrint.forEach(el => el.style.visibility = '');

    const { jsPDF } = window.jspdf;
    // Letter: 215.9 x 279.4 mm
    const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'letter' });
    const pdfW = pdf.internal.pageSize.getWidth();
    const pdfH = pdf.internal.pageSize.getHeight();

    const imgData = canvas.toDataURL('image/jpeg', 0.97);
    const imgW = pdfW;
    const imgH = (canvas.height * pdfW) / canvas.width;

    // If taller than one page, split across pages
    let yOffset = 0;
    while (yOffset < imgH) {
      if (yOffset > 0) pdf.addPage();
      pdf.addImage(imgData, 'JPEG', 0, -yOffset, imgW, imgH);
      yOffset += pdfH;
    }

    pdf.save('estimate.pdf');
    btn.textContent = '⬇ Download PDF';
    btn.disabled = false;
  }

  // ── Static field IDs ──
  const STATIC_IDS = [
    'companyName','companyAddress','companyCityStateZip','companyPhone','companyEmailWeb',
    'invoiceDate','customerNo','invoiceNo','billTo','deliverTo','salesTax'
  ];
  const LS_KEY = 'estimateFormData';

  // ── Save to localStorage ──
  function saveForm() {
    const data = {};
    STATIC_IDS.forEach(id => {
      const el = document.getElementById(id);
      if (el) data[id] = el.value;
    });
    const rows = [];
    document.querySelectorAll('#itemsBody tr').forEach(tr => {
      rows.push({
        qty:   tr.cells[0].querySelector('input').value,
        desc:  tr.cells[1].querySelector('input').value,
        price: tr.cells[2].querySelector('input').value
      });
    });
    data.rows = rows;
    localStorage.setItem(LS_KEY, JSON.stringify(data));
  }

  // ── Load from localStorage ──
  function loadForm() {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    STATIC_IDS.forEach(id => {
      const el = document.getElementById(id);
      if (el && data[id] !== undefined) el.value = data[id];
    });
    if (Array.isArray(data.rows) && data.rows.length > 0) {
      data.rows.forEach(r => addRow(r));
    } else {
      for (let i = 0; i < 16; i++) addRow();
    }
    calcTotals();
    return true;
  }

  // ── Attach save listeners to static fields ──
  function attachSaveListeners() {
    STATIC_IDS.forEach(id => {
      const el = document.getElementById(id);
      if (el) el.addEventListener('input', saveForm);
    });
  }

  // ── Init ──
  const DEFAULT_ROWS = 3;
  window.onload = () => {
    attachSaveListeners();
    const restored = loadForm();
    if (!restored) {
      for (let i = 0; i < DEFAULT_ROWS; i++) addRow();
      setDefaultDate();
    }
  };

  function setDefaultDate() {
    const today = new Date();
    const mm = String(today.getMonth()+1).padStart(2,'0');
    const dd = String(today.getDate()).padStart(2,'0');
    const yyyy = today.getFullYear();
    document.getElementById('invoiceDate').value = `${mm}/${dd}/${yyyy}`;
    saveForm();
  }

  // ── Add row ──
  function addRow(data) {
    const tbody = document.getElementById('itemsBody');
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="col-qty"><input type="number" min="0" step="any" oninput="calcRow(this);saveForm()" /></td>
      <td class="col-desc"><input type="text" oninput="saveForm()" /></td>
      <td class="col-price"><input type="number" min="0" step="0.01" oninput="calcRow(this);saveForm()" /></td>
      <td class="col-total"><input type="text" readonly /></td>
      <td class="no-print" style="text-align:center">
        <button class="del-btn" onclick="delRow(this)" title="Remove row">×</button>
      </td>`;
    tbody.appendChild(tr);
    if (data) {
      tr.cells[0].querySelector('input').value = data.qty  || '';
      tr.cells[1].querySelector('input').value = data.desc || '';
      tr.cells[2].querySelector('input').value = data.price|| '';
      // recalc row total
      const qty   = parseFloat(data.qty)   || 0;
      const price = parseFloat(data.price) || 0;
      const total = qty * price;
      tr.cells[3].querySelector('input').value = total > 0 ? total.toFixed(2) : '';
    }
  }

  function delRow(btn) {
    btn.closest('tr').remove();
    calcTotals();
    saveForm();
  }

  // ── Calc row total ──
  function calcRow(input) {
    const tr = input.closest('tr');
    const qty   = parseFloat(tr.cells[0].querySelector('input').value) || 0;
    const price = parseFloat(tr.cells[2].querySelector('input').value) || 0;
    const total = qty * price;
    tr.cells[3].querySelector('input').value = total > 0 ? total.toFixed(2) : '';
    calcTotals();
  }

  // ── Calc totals ──
  function calcTotals() {
    const rows = document.querySelectorAll('#itemsBody tr');
    let sub = 0;
    rows.forEach(tr => {
      const v = parseFloat(tr.cells[3].querySelector('input').value) || 0;
      sub += v;
    });
    const tax = parseFloat(document.getElementById('salesTax').value) || 0;
    const total = sub + tax;
    document.getElementById('subtotal').value     = sub   > 0 ? sub.toFixed(2)   : '';
    document.getElementById('invoiceTotal').value = total > 0 ? total.toFixed(2) : '';
  }

  // ── Clear form ──
  function clearForm() {
    if (!confirm('Clear all fields?')) return;
    localStorage.removeItem(LS_KEY);
    document.querySelectorAll('input[type="text"], input[type="number"], textarea').forEach(el => {
      if (!el.readOnly) el.value = '';
    });
    document.getElementById('itemsBody').innerHTML = '';
    for (let i = 0; i < DEFAULT_ROWS; i++) addRow();
    setDefaultDate();
    calcTotals();
  }
</script>
</body>
</html>
